name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run pytest CLI & hygiene suite
        run: python -m pytest -v

      - name: Lint starter vault (strict links + full Atlas audit)
        run: python scripts/lint_vault.py --strict-links --full-atlas

      - name: Verify multi-agent adapter files are in sync
        run: python scripts/sync_agent_adapters.py --check

      - name: Verify Spoiler Firewall export (dry-run + audit)
        run: python scripts/export_player_view.py --dry-run --verify

      - name: Validate demo Atlas VTT 0.16.0 scene and linked dashboard
        run: python .agents/skills/dungeons-and-maps/scripts/atlas_scene_tools.py validate "template-vault/atlas-vtt/collections/Campaign/scenes/Demo - Oakhaven Alley.atlasmap" --dashboard "template-vault/atlas-vtt/collections/Campaign/notes/Demo - Oakhaven Alley.md"

      - name: Audit demo Atlas VTT scene walls & lighting (--strict)
        run: python .agents/skills/dungeons-and-maps/scripts/atlas_scene_tools.py audit-walls "template-vault/atlas-vtt/collections/Campaign/scenes/Demo - Oakhaven Alley.atlasmap" --strict
